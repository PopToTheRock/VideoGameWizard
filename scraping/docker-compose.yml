# One-command local stack for the VideoGameWizard backend: the RAG server + Ollama.
#
#   cd scraping
#   docker compose up --build
#   docker compose exec ollama ollama pull llama3.1:8b   # first run only
#
# Prerequisite: a prebuilt ChromaDB index at ./data/chromadb
# (run chunker.py then embed.py to produce it).
services:
  rag-server:
    build: .
    image: videogamewizard-rag
    ports:
      # Loopback-only: publishing "8000:8000" would expose the (auth-off) server
      # to the whole LAN. To serve other devices, set VGW_API_KEY and widen this.
      - "127.0.0.1:8000:8000"
    environment:
      VGW_OLLAMA_URL: http://ollama:11434
      VGW_CHROMA_PATH: /data/chromadb
      # Keep the feedback/preference log on the mounted volume — the in-image
      # default (/app/data) is ephemeral and vanishes on container recreation.
      VGW_FEEDBACK_PATH: /data/feedback.jsonl
      HF_HOME: /models
    volumes:
      - ./data:/data        # prebuilt ChromaDB index (read) + feedback.jsonl (append)
      - hf-cache:/models    # cache the embedding model across restarts
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      # Loopback-only: raw Ollama has no auth at all.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # For GPU acceleration, install the NVIDIA Container Toolkit and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  hf-cache:
  ollama-models:
