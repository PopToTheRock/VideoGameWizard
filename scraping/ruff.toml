line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "W"]

[lint.flake8-bugbear]
# FastAPI's Depends/Query/etc. are intentionally called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]
