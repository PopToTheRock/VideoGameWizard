version: 2
updates:
  # Gradle dependencies (root build + app module)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gradle"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # Keep GitHub Actions workflow versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Python dependencies (requirements*.txt)
  - package-ecosystem: "pip"
    directory: "/scraping"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # Docker base image (python:3.12-slim)
  - package-ecosystem: "docker"
    directory: "/scraping"
    schedule:
      interval: "weekly"
